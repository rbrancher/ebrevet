name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - name: Stub region secrets
        run: cp harness/ci/region_data.stub.dart lib/region_data.dart
      - name: Validate intents
        run: python3 harness/scripts/intents.py validate
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Build web (mock mode)
        run: flutter build web --release --no-wasm-dry-run --dart-define=EBREVET_MOCK=true
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 7

  preview:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # No preview for PRs that cannot change the app, e.g. intent-only (gate 1) PRs.
      # Every changed file under intents/ or docs/, or a Markdown file, means nothing to preview.
      - name: Does this PR change the app?
        id: scope
        run: |
          files=$(gh pr diff ${{ github.event.number }} -R "${{ github.repository }}" --name-only)
          echo "$files"
          if echo "$files" | grep -qvE '^(intents/|docs/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only intents/docs/Markdown changed; skipping preview deploy."
          fi
      - name: Skip notice
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping preview deploy."
      - uses: actions/download-artifact@v4
        if: env.HAS_CF == 'true' && steps.scope.outputs.code == 'true'
        with:
          name: web
          path: web
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true' && steps.scope.outputs.code == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=${{ vars.CF_PAGES_PROJECT || 'ebrevet' }} --branch=pr-${{ github.event.number }}
      - name: Comment preview URL
        if: env.HAS_CF == 'true' && steps.scope.outputs.code == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            **Web preview (mock mode):** ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
            Built from ${{ github.event.pull_request.head.sha }}. Mock data only: no real servers are contacted.

  # Post-merge: main now reflects the merged intent's status; publish the production preview too.
  deploy-main:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping deploy."
      - uses: actions/download-artifact@v4
        if: env.HAS_CF == 'true'
        with:
          name: web
          path: web
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_CF == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=${{ vars.CF_PAGES_PROJECT || 'ebrevet' }} --branch=main
