name: pr-review
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]

jobs:
  review:
    if: >-
      startsWith(github.head_ref, 'agent/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prompt
        run: |
          {
            echo 'text<<__EOF__'
            cat harness/prompts/review.md
            echo
            echo "PR number: ${{ github.event.number }}. Use: gh pr view ${{ github.event.number }} and gh pr diff ${{ github.event.number }}"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        env:
          # Pin gh to this repo; agents must never act on any other repository.
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent PRs are opened by the Claude app. The job-level `if` already limits
          # this workflow to agent/* branches in this repository (never forks).
          allowed_bots: claude
          restrict_untrusted_prs: "false"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*)"
