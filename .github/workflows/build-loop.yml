name: build-loop
# Gate 1 has passed when an intent with `status: approved` lands on main (via a reviewed PR).
#
# claude-code-action does not run on `push` events, so this is two-stage:
#   push to main  -> `dispatch` finds newly approved intents and starts one
#                    workflow_dispatch run of this workflow per intent
#   workflow_dispatch -> `implement` runs the agent for that one intent
on:
  push:
    branches: [main]
    paths: ['intents/**']
  workflow_dispatch:
    inputs:
      intent:
        description: 'Path to an approved intent, e.g. intents/0001-foo.md'
        required: true

jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch one implement run per newly approved intent
        run: |
          list=$(python3 harness/scripts/intents.py approved-changed "${{ github.event.before }}" "${{ github.sha }}")
          if [ -z "$list" ]; then echo "No newly approved intents."; exit 0; fi
          for f in $list; do
            echo "Dispatching implement run for $f"
            gh workflow run build-loop.yml -R "${{ github.repository }}" --ref main -f intent="$f"
          done

  implement:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: implement-${{ inputs.intent }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - name: Check intent is approved
        env:
          INTENT: ${{ inputs.intent }}
        run: |
          case "$INTENT" in intents/[0-9][0-9][0-9][0-9]-*.md) ;; *) echo "::error::bad intent path"; exit 1;; esac
          [ -f "$INTENT" ] || { echo "::error::$INTENT not found"; exit 1; }
          grep -q '^status: approved' "$INTENT" || { echo "::error::$INTENT is not approved"; exit 1; }
      - name: Prepare branch
        id: prep
        env:
          INTENT: ${{ inputs.intent }}
        run: |
          slug=$(basename "$INTENT" .md)
          echo "branch=agent/$slug" >> "$GITHUB_OUTPUT"
          git checkout -b "agent/$slug"
          cp harness/ci/region_data.stub.dart lib/region_data.dart
          flutter pub get
      - id: prompt
        env:
          INTENT: ${{ inputs.intent }}
        run: |
          {
            echo 'text<<__EOF__'
            cat harness/prompts/implement.md
            echo
            echo "Intent file: $INTENT. Branch: ${{ steps.prep.outputs.branch }}."
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # continue-slices.yml / build-loop dispatch these runs with GITHUB_TOKEN, so the
          # actor is github-actions. Only workflows in this repo can act as that bot.
          allowed_bots: github-actions
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ vars.IMPLEMENT_MODEL || 'claude-opus-5-5' }}
            --max-turns 150
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(flutter:*),Bash(dart:*),Bash(python3 harness/scripts/intents.py:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --disallowedTools "Bash(git push origin main:*),Bash(git push --force:*),WebFetch,WebSearch"
      - name: Guardrail - protected paths untouched
        if: always()
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -E '^(\.github/|harness/|android/key\.properties|lib/region_data\.dart)'; then
            echo "::error::Agent modified protected paths"; exit 1
          fi
