name: triage
# Gate 0: only a maintainer-applied `request` label (or a maintainer `/triage` comment) starts triage.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  # Dispatched by continue-slices.yml after a non-final slice merges (write access required).
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re-)triage
        required: true

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue }}

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.issue.pull_request && (
        (github.event_name == 'issues' && github.event.label.name == 'request') ||
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/triage') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # intents.py for-issue reads merge history to tell built slices
      - id: prompt
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          {
            echo 'text<<__EOF__'
            cat harness/prompts/triage.md
            echo
            echo "Repository: ${{ github.repository }}. Issue number: $ISSUE."
            echo "Read the issue with: gh issue view $ISSUE --comments"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        env:
          # Pin gh to this repo; agents must never act on any other repository.
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # continue-slices.yml / build-loop dispatch these runs with GITHUB_TOKEN, so the
          # actor is github-actions. Only workflows in this repo can act as that bot.
          allowed_bots: github-actions
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ vars.TRIAGE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(python3 harness/scripts/intents.py:*),Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr create:*)"
